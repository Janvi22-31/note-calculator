<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Note Calculator</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <h1 class="logo">💵 Note Calculator</h1>
      <nav class="nav">
        <a href="index.html" class="active">Home</a>
        <a href="index.html#calculator">Calculator</a>
        <a href="history.html">History</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="container">
      <h2>Note Calculator</h2>
      <p class="subtitle">Calculate the number of currency notes easily</p>
    </div>
  </section>

  <!-- Calculator card -->
  <main class="container">
    <section id="calculator" class="card calculator-card">
      <h3>Enter Amount</h3>
      <div class="form-group">
        <label for="amount">Amount</label>
        <div class="input-with-prefix">
          <span class="prefix">₹</span>
          <input type="number" id="amount" placeholder="Enter amount" min="0" step="0.01" />
        </div>
        <p class="error-text" id="amountError"></p>
      </div>

      <h3>Select Note</h3>
      <div class="form-group">
        <label for="denomination">Denomination</label>
        <select id="denomination">
          <option value="">Select denomination</option>
          <option value="10">₹10</option>
          <option value="50">₹50</option>
          <option value="100">₹100</option>
          <option value="200">₹200</option>
          <option value="500">₹500</option>
          <option value="2000">₹2000</option>
        </select>
        <p class="error-text" id="denominationError"></p>
      </div>

      <div class="button-row">
        <button id="calculateBtn" class="btn btn-primary">Calculate</button>
        <button id="clearBtn" class="btn btn-secondary">Clear</button>
      </div>

      <p class="server-message" id="serverMessage"></p>
    </section>

    <!-- Result card (hidden until a calculation is made) -->
    <section class="card result-card" id="resultCard" style="display:none;">
      <h3>Calculation Result</h3>
      <div class="result-grid">
        <div class="result-row">
          <span>Amount:</span>
          <strong id="resultAmount">₹0</strong>
        </div>
        <div class="result-row">
          <span>Selected Note:</span>
          <strong id="resultDenomination">₹0</strong>
        </div>
        <div class="result-row highlight">
          <span>Number of Notes:</span>
          <strong id="resultNotes">0</strong>
        </div>
        <div class="result-row">
          <span>Remaining Amount:</span>
          <strong id="resultRemainder">₹0</strong>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Note Calculator. Built with Java, Spring Boot &amp; MySQL.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
